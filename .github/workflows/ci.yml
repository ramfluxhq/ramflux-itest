name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# One group per ref: a newer push to a feature branch cancels the older run.
# Main runs get a per-commit group so they are never cancelled or superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# NOTE: this workflow only COMPILES everything (including the realnet
# feature). The `realnet` integration tests need the product checkout and a
# live Docker compose mesh; they run in realnet.yml.
jobs:
  build:
    name: fmt, clippy, build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Cache
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-features
