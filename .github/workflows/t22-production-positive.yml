name: T22 production positive (manual)

# Manual-only positive proof for T22-A3-PROD-POSITIVE: bring up the REAL production
# deploy/docker-compose.yml (not docker-compose.itest*) in keyless v3 mode with
# test-generated NON-SECRET trust materials and assert the relay client QUIC
# listener reaches health plus public SDK/rf object PUT/GET/ACK/TOMBSTONE over
# that production deployment. Heavier than the s70 static/fail-closed smoke: it
# host-builds the 7 production node binaries and runs the full production
# compose, so it needs a Linux runner with docker. Never wired to push/PR.
on:
  workflow_dispatch:

concurrency:
  group: t22-production-positive-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  t22-prod-positive:
    name: t22 production positive (public SDK object)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The test resolves the product deploy dir as <parent>/ramflux/deploy and runs
      # its bootstrap/issue-certs/build-prod-images scripts, so check out product and
      # itest as siblings.
      - name: Checkout ramflux (product, pinned)
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          repository: ramfluxhq/ramflux
          ref: 601593b7216e8325bad3e4c1be5a5e5b378d8063
          path: ramflux
          persist-credentials: false

      - name: Checkout ramflux-itest (this repo)
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          path: ramflux-itest
          persist-credentials: false

      - name: Cache
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31
        with:
          # Both workspaces build: the product node binaries (build-prod-images.sh)
          # and the itest test binary.
          workspaces: |
            ramflux
            ramflux-itest

      - name: Run T22 production positive
        working-directory: ramflux-itest
        env:
          RAMFLUX_T22_PRODUCTION_POSITIVE: "1"
        run: |
          cargo test --features realnet --no-default-features \
            t22_production_positive_public_sdk_object_four_ops -- --nocapture --test-threads=1
