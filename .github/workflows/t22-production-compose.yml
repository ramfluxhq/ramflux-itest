name: T22 production compose

# Required-input preflight and independent real service startup refusal on both
# providers. Resolve the product from Cargo.toml, never a second hard-coded pin.
on:
  push:
    branches: ["**", "!backup/**"]
  workflow_dispatch:

concurrency:
  group: t22-production-compose-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  t22-compose-smoke:
    name: t22 production compose (${{ matrix.provider }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        provider: [docker, podman-compose]
    steps:
      - name: Free disk space (only when short)
        # Hosted runner images vary in free space; deleting preinstalled SDKs
        # costs 1-3 minutes, so it only runs when less than 40 GB is free.
        run: |
          df -h /
          avail=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          if [ "$avail" -lt 40 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            docker image prune -af >/dev/null
            df -h /
          fi

      - name: Checkout ramflux-itest
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          path: ramflux-itest
          persist-credentials: false

      - name: Resolve pinned product
        id: product
        run: |
          pin=$(grep -oE 'ramfluxhq/ramflux\.git", rev = "[0-9a-f]{40}"' ramflux-itest/Cargo.toml | grep -oE '[0-9a-f]{40}' | sort -u)
          test "$(printf '%s\n' "$pin" | wc -l)" -eq 1
          printf '%s' "$pin" | grep -qxE '[0-9a-f]{40}'
          echo "sha=$pin" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned product
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          repository: ramfluxhq/ramflux
          ref: ${{ steps.product.outputs.sha }}
          path: ramflux
          persist-credentials: false

      - name: Install Podman Compose 1.3.0
        if: matrix.provider == 'podman-compose'
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          python3 -m venv "$RUNNER_TEMP/podman-compose"
          "$RUNNER_TEMP/podman-compose/bin/pip" install podman-compose==1.3.0
          echo "$RUNNER_TEMP/podman-compose/bin" >> "$GITHUB_PATH"

      - name: Toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb
        with:
          workspaces: |
            ramflux-itest

      - name: Build real relay image
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          engine=docker
          if [ "$PROVIDER" = podman-compose ]; then engine=podman; fi
          timeout 3600 "$engine" build --target source-runtime \
            --build-arg BIN=ramflux-relay -f ramflux/deploy/Dockerfile \
            -t ramflux-s70-relay:itest ramflux

      - name: Run fail-closed checks (no skip allowed)
        working-directory: ramflux-itest
        env:
          RAMFLUX_T22_PRODUCTION_SMOKE: "1"
          RAMFLUX_S70_COMPOSE_PROVIDER: ${{ matrix.provider }}
          RAMFLUX_S70_RELAY_IMAGE: ramflux-s70-relay:itest
        run: |
          set -o pipefail
          timeout 1200 cargo test --locked --features realnet --no-default-features \
            tests::mvp_s70_t22_production_keyless_v3::t22_production_keyless_v3_compose_smoke \
            -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/s70.log"
          grep -q '1 passed; 0 failed' "$RUNNER_TEMP/s70.log"
          if grep -q 'skipping T22' "$RUNNER_TEMP/s70.log"; then
            echo "::error::s70 reported a skip"; exit 96
          fi
          if [ "$RAMFLUX_S70_COMPOSE_PROVIDER" = docker ]; then
            grep -qx 's70 docker-v2 config refusal checked' "$RUNNER_TEMP/s70.log"
          fi
